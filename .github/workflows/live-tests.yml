# Geplante Live-Tests gegen die echten Quellen (DRIFT-005).
#
# WARUM DER NAME KEINE QUELLE NENNT
# ---------------------------------
# Bis zum 19.8.2026 hiess dieser Workflow «gegen api.crossref.org». Die Suite
# fragt neun Hosts ab, und crossref gehoert zu den am schwaechsten vertretenen.
# Ausgezaehlt aus den `-m live`-Tests. Die Tabelle ist kein Merkzettel: Sie wird
# von `scripts/check_gate_consistency.py` gegen `src/` (Hosts) und gegen
# `tests/` (Zahlen) gehalten. Die Marker unten begrenzen den geprueften Bereich
# — wer sie entfernt, macht den Gate rot, statt ihn still abzuschalten.
#
# QUELLEN-TABELLE ANFANG
#   swisscovery.slsp.ch (SRU)                           10
#   www.e-rara.ch (OAI)                                  7
#   www.e-manuscripta.ch (OAI)                           4
#   www.e-periodica.ch (OAI)                             3
#   sui-generis.ch, ex-ante.ch, api.repositorium.ch      2   (oa_legal)
#   api.crossref.org, export.arxiv.org                   2   (intl_metadata)
#   quellenuebergreifend                                 1
#   library_info (ohne externe Quelle)                   1
# QUELLEN-TABELLE ENDE
#
# Ein Name, der eine Quelle herausgreift, ist nicht bloss ungenau: Wer den
# roten Lauf vom 17.8.2026 im Posteingang sah, las den Titel und suchte bei
# der dort genannten Quelle. Der Fehler lag im httpx-Client, und betroffen
# waren swisscovery, e-rara, e-periodica und e-manuscripta — also genau die
# vier, die im Titel fehlten.
#
# Wer hier eine Quelle ergaenzt, aendert den Namen NICHT mit. Er soll generisch
# bleiben; die Aufzaehlung oben gehoert nachgezogen.
#
# Die Unit-Tests laufen gegen aufgezeichnete bzw. gemockte Antworten und
# koennen deshalb nicht bemerken, wenn die Quelle ihr Format aendert. Die
# `-m live`-Tests fragen sie wirklich ab; die CI der Pull Requests schliesst
# sie per `-m "not live"` aus, und das bleibt so.
#
# Achtung: `schedule` greift nur auf dem Default-Branch. Aenderungen an dieser
# Datei werden erst nach dem Merge wirksam. Vorher per `workflow_dispatch`
# von Hand ausloesen.

name: Live-Tests

on:
  schedule:
    # Woechentlich. Die ungerade Minute ist Absicht: Auf :00 legt GitHub die
    # Laeufe der halben Welt, und ein verzoegerter Cron faellt bei Last aus.
    # Gestaffelt gegen die uebrigen Server des Portfolios.
    - cron: "43 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    name: Live-Suite gegen die echten Quellen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install uv && uv pip install -e "." --system && uv pip install pytest pytest-asyncio respx --system

      # `continue-on-error`, damit die Einordnung in jedem Fall laeuft. Rot
      # wird der Job weiter unten, aus dem eingeordneten Ergebnis.
      - name: Live-Suite
        id: suite
        continue-on-error: true
        run: |
          set +e
          pytest -m live -v --junitxml=live-report.xml 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `if: failure()` kennt rot und nicht rot. Ein Live-Lauf hat vier
      # Antworten, und die letzten drei zaehlen: Ein gescheitertes `pip
      # install` oder eine umbenannte Marke (`unknown`) sind NICHT dasselbe wie
      # ein gebrochener Vertrag (`finding`), und eine Quelle, die gerade nicht
      # antwortet (`upstream`), ist wieder etwas anderes. Und ein Lauf, in dem
      # jeder Test uebersprungen wurde, sieht unter jedem Exit-Code-Check aus
      # wie Erfolg.
      - name: Ergebnis einordnen
        id: verdict
        run: |
          python scripts/classify_live_run.py live-report.xml \
            --pytest-exit "${{ steps.suite.outputs.pytest_exit }}"
          {
            echo "tail<<PYTEST_TAIL"
            tail -n 40 live-output.txt || true
            echo "PYTEST_TAIL"
          } >> "$GITHUB_OUTPUT"

      - name: Issue oeffnen, aktualisieren oder schliessen
        uses: actions/github-script@v7
        # Ueber `env`, nicht ueber `${{ }}` im Skript: Die pytest-Ausgabe ist
        # fremder Text, der sonst in einem JavaScript-Template-Literal landet.
        # Ein Backtick oder ein `${` darin bricht das Skript oder fuehrt aus,
        # was in einer Assertion-Meldung stand.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
          LIVE_TAIL: ${{ steps.verdict.outputs.tail }}
        with:
          script: |
            const state = process.env.LIVE_STATE;
            const reason = process.env.LIVE_REASON || '';
            const tail = process.env.LIVE_TAIL || '(keine Ausgabe)';
            // Stabiles Praefix: Damit ein zweiter roter Lauf den bestehenden
            // Thread verlaengert statt einen zweiten aufzumachen. Zehn Issues
            // zur selben Sache liest niemand.
            // Beim Aendern dieses Praefixes findet der naechste rote Lauf ein
            // offenes Issue mit dem ALTEN Titel nicht mehr und macht ein zweites
            // auf. Vor der Umbenennung am 19.8.2026 geprueft: kein offenes Issue
            // mit Label `upstream` vorhanden, also nichts verwaist. Wer es
            // erneut aendert, prueft das erneut — oder benennt die offenen
            // Issues von Hand um.
            const PREFIX = 'Live-Tests gegen die echten Quellen rot';
            const LABEL = 'upstream';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const heute = new Date().toISOString().slice(0, 10);

            // `issues.listForRepo` statt der Such-API: Die Suche hat ein
            // eigenes, knappes Rate-Limit und indexiert verzoegert — ein frisch
            // geoeffnetes Issue findet sie unter Umstaenden nicht, und dann
            // legt der naechste rote Lauf ein zweites an.
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const open = issues.data.find(
              (i) => !i.pull_request && i.title.startsWith(PREFIX)
            );

            if (state === 'unknown') {
              // Weder oeffnen noch schliessen. Der Lauf hat nichts ueber den
              // Vertrag mit den Quellen festgestellt, und ein Issue, das auf so
              // einen Lauf hin zugeht, behauptet einen Vergleich, den es nicht
              // gab. Sichtbar wird es ueber den roten Job.
              core.warning(`Live-Suite nicht ausgewertet: ${reason}. Am Issue wurde nichts geaendert.`);
              return;
            }

            if (state === 'upstream') {
              // Dieselbe Behandlung wie `unknown`, aus demselben Grund: Der
              // Vertrag wurde nicht geprueft, sondern die Quelle antwortete
              // nicht. Kein Issue aufmachen (es gaebe nichts zu fixen) und
              // keines zumachen (es wurde nichts verglichen). Rot wird der Job
              // weiter unten — ein Ausfall, der eine Woche anhaelt, gehoert
              // gesehen, auch wenn niemand ihn beheben kann.
              core.warning(`Quelle nicht erreichbar: ${reason}. Am Issue wurde nichts geaendert.`);
              return;
            }

            if (state === 'finding') {
              const body = [
                'Die geplante Live-Suite gegen die echten Quellen ist rot.',
                '',
                `Lauf: ${run}`,
                `Einordnung: ${reason}`,
                '',
                '**Rot heisst hier dreierlei**, und keines davon ist aus der Meldung',
                'abzulesen: Der Vertrag mit der Quelle hat sich geaendert; die Quelle ist',
                'gerade aus; oder der Fehler steht bei uns und die Quelle ist unschuldig.',
                'Nur das Erste sehen die Unit-Tests nicht, weil ihre Fixtures aus derselben',
                'Annahme geschrieben sind wie der Code.',
                '',
                'Das Dritte stand hier zwischenzeitlich nicht — und war am 17.8.2026 die',
                'Antwort: 13 Fehlschlaege mit `RuntimeError: Event loop is closed`, waehrend',
                'alle vier Quellen einwandfrei antworteten. Ein Issue, das nur zwei',
                'Moeglichkeiten anbietet, schickt den Leser in die falsche Datei.',
                '',
                'Erst die Quelle abfragen, dann einordnen — nicht aus der Fehlermeldung',
                'schliessen.',
                '',
                '<details><summary>Letzte Zeilen der pytest-Ausgabe</summary>',
                '',
                '```',
                tail,
                '```',
                '',
                '</details>',
              ].join('\n');

              if (open) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: open.number,
                  body: `Wieder rot am ${heute}.\n\n${body}`,
                });
              } else {
                // Das Label anlegen, falls das Repo es noch nicht kennt: Sonst
                // scheitert `issues.create` beim allerersten roten Lauf — genau
                // dann, wenn das Issue gebraucht wird.
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name: LABEL, color: 'd93f0b',
                    description: 'Vertrag mit einer externen Quelle betroffen',
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;  // 422 = existiert bereits
                }
                await github.rest.issues.create({
                  ...context.repo, title: `${PREFIX} (${heute})`, body, labels: [LABEL],
                });
              }
              return;
            }

            // clear — und nur hier wird zugemacht, weil nur hier wirklich
            // verglichen und nichts gefunden wurde.
            if (open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.number,
                body: `Die Live-Suite ist wieder gruen (${reason}). Lauf: ${run}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: open.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      # Erst hier wird der Job rot. `clear` ist gruen; `finding`, `upstream`
      # und `unknown` sind alle rot, aber nur `finding` hat oben ein Issue
      # erzeugt — der Unterschied steht im Log, nicht im Exit-Code.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        # Ueber `env`, nicht ueber `${{ }}`: Der Grund kann eine Parser-Meldung
        # ueber eine fremde Datei enthalten, und `${{ }}` setzt ihn vor dem Start
        # woertlich in die Shell ein — ein `$(...)` oder ein Anfuehrungszeichen
        # darin liefe mit. Der github-script-Schritt macht es aus demselben Grund
        # schon so.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live-Suite: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
