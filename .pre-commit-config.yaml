# Lokales Gegenstueck zu den ruff-Gates aus .github/workflows/ci.yml.
#
# `rev` ist der Pin: Das Tag v0.16.6 dieses Hook-Repos installiert `ruff==0.16.6`
# — dieselbe Version wie das `dev`-Extra in pyproject.toml, aus dem die CI-Jobs
# `test` und `lint` installieren. `ci.yml` pinnt nicht mehr selbst; geprueft wird
# der Gleichstand von pyproject.toml, dieser `rev`-Zeile und den zwei Stellen im
# CLAUDE.md-Absatz «Dieses Repo» — scripts/check_gate_consistency.py haelt sie
# gegeneinander. Wer eine davon hochzieht, zieht alle hoch: Eine andere
# ruff-Version meldet Abweichungen, die niemand verursacht hat, und kostet die
# Suche danach. Genau daran ist der Dependabot-Bump auf 0.16.6 zuerst gescheitert,
# der nur pyproject.toml anfasste.
#
# Der Pin wirkt erst nach der Installation im Klon — pre-commit richtet sich
# nicht von selbst ein:
#
#   pip install pre-commit && pre-commit install
#
# Ohne diesen Schritt liegt die Datei nur herum und die CI bleibt das einzige
# Gate. `pre-commit run --all-files` faehrt beide Hooks einmal ueber alles.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # `files` haelt den Scope deckungsgleich mit der CI, die beide Gates auf
      # `src/ tests/ scripts/` fahrt. Weicht der Hook davon ab, ist er in der
      # einen Richtung nutzlos (er laesst durch, was die CI ablehnt) und in der
      # anderen laestig (er blockiert Commits wegen Befunden, die keine Pipeline
      # je meldet). Wer den CI-Scope aendert, aendert diese Regex mit.
      - id: ruff-check
        files: ^(src|tests|scripts)/

      # Die CI fahrt hier `ruff format --check`, dieser Hook formatiert direkt.
      # Das Ergebnis ist dasselbe — der Commit bricht in beiden Faellen ab —,
      # nur raeumt die lokale Variante gleich auf, statt es zu verlangen.
      - id: ruff-format
        files: ^(src|tests|scripts)/
